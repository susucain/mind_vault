# Mind Vault Nginx locations.
#
# Include this file inside the existing HTTPS server block. It is intentionally
# not a standalone `server {}` block because the ECS already hosts other sites.

location = /mind-vault {
  return 301 /mind-vault/;
}

location ^~ /mind-vault/v1/ {
  proxy_pass http://127.0.0.1:13000/v1/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_buffering off;
  proxy_cache off;
  proxy_request_buffering off;
  proxy_read_timeout 310s;
  proxy_send_timeout 310s;
  client_max_body_size 100m;
  gzip off;
}

location = /mind-vault/index.html {
  alias /var/www/mind-vault/index.html;
  add_header Cache-Control "no-cache, no-store, must-revalidate";
}

location ^~ /mind-vault/ {
  alias /var/www/mind-vault/;
  index index.html;
  try_files $uri $uri/ /mind-vault/index.html;
}
