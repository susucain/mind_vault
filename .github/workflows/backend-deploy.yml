name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "mind_vault_api/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  API_TAG: sha-${{ github.sha }}
  ES_TAG: sha-${{ github.sha }}

jobs:
  test-build-push:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mind_vault_api/pnpm-lock.yaml

      - name: Install and test
        working-directory: mind_vault_api
        run: |
          pnpm install --frozen-lockfile
          pnpm exec jest --runInBand
          pnpm build

      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./mind_vault_api
          file: ./mind_vault_api/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ secrets.ACR_API_REPOSITORY }}:${{ env.API_TAG }}

      - name: Build and push Elasticsearch image
        uses: docker/build-push-action@v6
        with:
          context: ./mind_vault_api/elasticsearch
          file: ./mind_vault_api/elasticsearch/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ secrets.ACR_ES_REPOSITORY }}:${{ env.ES_TAG }}

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.ECS_DEPLOY_SSH_KEY }}

      - name: Install known hosts
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.ECS_KNOWN_HOSTS }}' > ~/.ssh/known_hosts

      - name: Upload deployment assets
        run: |
          ssh -p "${{ secrets.ECS_PORT || 22 }}" \
            "${{ secrets.ECS_DEPLOY_USER }}@${{ secrets.ECS_HOST }}" \
            'mkdir -p /opt/mind-vault/init-scripts/postgresql /opt/mind-vault/init-scripts/mongodb'
          scp -P "${{ secrets.ECS_PORT || 22 }}" \
            mind_vault_api/deploy/compose.prod.yml \
            mind_vault_api/deploy/deploy.sh \
            mind_vault_api/deploy/nginx.prod.conf \
            mind_vault_api/rabbitmq/rabbitmq.conf \
            "${{ secrets.ECS_DEPLOY_USER }}@${{ secrets.ECS_HOST }}:/opt/mind-vault/"
          scp -P "${{ secrets.ECS_PORT || 22 }}" -r \
            mind_vault_api/init-scripts/postgresql/. \
            "${{ secrets.ECS_DEPLOY_USER }}@${{ secrets.ECS_HOST }}:/opt/mind-vault/init-scripts/postgresql/"
          scp -P "${{ secrets.ECS_PORT || 22 }}" -r \
            mind_vault_api/init-scripts/mongodb/. \
            "${{ secrets.ECS_DEPLOY_USER }}@${{ secrets.ECS_HOST }}:/opt/mind-vault/init-scripts/mongodb/"
          ssh -p "${{ secrets.ECS_PORT || 22 }}" \
            "${{ secrets.ECS_DEPLOY_USER }}@${{ secrets.ECS_HOST }}" \
            'chmod +x /opt/mind-vault/deploy.sh'

      - name: Deploy
        run: |
          ssh -p "${{ secrets.ECS_PORT || 22 }}" \
            "${{ secrets.ECS_DEPLOY_USER }}@${{ secrets.ECS_HOST }}" \
            "/opt/mind-vault/deploy.sh '${{ env.API_TAG }}' '${{ env.ES_TAG }}'"
